<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>7K RTA Draft</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <header class="top">
      <div>
        <h1>7K RTA <span>Draft</span></h1>
        <p id="connection">เล่นเครื่องเดียว</p>
      </div><button id="reset" type="button">เริ่มใหม่</button>
    </header>
    <div class="lobby">
      <button id="create" type="button" class="gold">สร้างห้องออนไลน์ (ผู้ชม)</button>
      <button id="resume" type="button" hidden>กลับเข้าห้องเดิม</button>
      <span id="room-code" hidden></span>
      <button id="leave" type="button" hidden>ปิดห้อง</button>
    </div>
    <div id="invites" class="invites" hidden>
      <div class="invite" data-side="0"><span class="invite-label">ลิงก์ผู้เล่นฝั่งน้ำเงิน</span><span
          class="invite-state"></span><button type="button" class="copy-link">คัดลอกลิงก์</button><button type="button"
          class="renew-link" title="ลิงก์เก่าจะใช้ไม่ได้ และผู้เล่นฝั่งนี้จะถูกนำออก">สร้างลิงก์ใหม่</button></div>
      <div class="invite" data-side="1"><span class="invite-label">ลิงก์ผู้เล่นฝั่งแดง</span><span
          class="invite-state"></span><button type="button" class="copy-link">คัดลอกลิงก์</button><button type="button"
          class="renew-link" title="ลิงก์เก่าจะใช้ไม่ได้ และผู้เล่นฝั่งนี้จะถูกนำออก">สร้างลิงก์ใหม่</button></div>
    </div>
    <form class="setup" id="setup" aria-label="ตั้งชื่อผู้เล่น">
      <label class="blue-label" for="blue-name">ชื่อฝั่งน้ำเงิน<input id="blue-name" maxlength="32"
          placeholder="ทีมน้ำเงิน" autocomplete="off"></label>
      <label class="red-label" for="red-name">ชื่อฝั่งแดง<input id="red-name" maxlength="32" placeholder="ทีมแดง"
          autocomplete="off"></label>
      <button id="start" class="gold" type="submit" disabled>เริ่มดราฟ</button>
    </form>
    <p id="status" role="status"></p>
    <ol id="phase-list" class="phases" aria-label="ขั้นตอนการดราฟ"></ol>
    <div class="bar">
      <div id="blue-bans" class="spectator-bar-bans blue" hidden></div>
      <div class="turn-summary" role="status">
        <strong id="turn"></strong>
        <p id="next-turn" hidden></p>
      </div>
      <div class="turn-controls">
        <span id="step"></span>
        <span id="timer" role="timer" aria-label="เวลาเหลือ" hidden>01:00</span>
        <button id="show-match" type="button" hidden>ดู Match Up</button>
      </div>
      <div id="red-bans" class="spectator-bar-bans red" hidden></div>
    </div>
    <div class="board">
      <aside id="blue" class="team" aria-label="ทีมฟ้า"></aside>
      <section class="center" aria-labelledby="roster-title">
        <h2 id="roster-title">คลังฮีโร่ <span id="hero-count"></span></h2>
        <div class="filters">
          <input id="search" type="search" placeholder="ค้นหาชื่อไทยหรืออังกฤษ" aria-label="ค้นหาฮีโร่">
          <select id="tier" aria-label="ระดับฮีโร่">
            <option value="all">ทุกระดับ</option>
            <option>L++</option>
            <option>L+</option>
            <option>L</option>
            <option>R</option>
          </select>
          <label><input id="hide" type="checkbox"> ซ่อนตัวที่ใช้แล้ว</label>
        </div>
        <div id="hero-types" class="type-filters" role="group" aria-label="ประเภทฮีโร่"></div>
        <div id="pool"></div>
        <p id="empty" hidden>ไม่พบฮีโร่ที่ตรงกับตัวกรอง</p>
        <div class="confirm"><span id="selection"></span><button id="confirm" class="gold" type="button"
            aria-describedby="selection" disabled>ยืนยัน Ban</button></div>
        <div id="spectator-live" class="spectator-live" hidden></div>
      </section>
      <aside id="red" class="team red" aria-label="ทีมแดง"></aside>
    </div>
    <footer>รูปและรายชื่อจาก <a href="https://7katlas.com/codex.html" target="_blank" rel="noopener">7K Atlas Codex</a>
    </footer>
  </main>
  <div id="draft-reveal" aria-hidden="true" hidden>
    <div class="reveal-panel">
      <h2 id="reveal-title"></h2>
      <ul id="reveal-heroes" class="reveal-heroes"></ul>
    </div>
  </div>
  <dialog id="match-up" aria-labelledby="match-title">
    <div class="match-stage">
      <form class="match-dismiss" method="dialog"><button id="close-match" type="submit" aria-label="ปิด Match Up"
          autofocus>×</button></form>
      <h2 id="match-title">Match Up</h2>
      <div class="match-teams">
        <section id="match-blue" class="match-team"></section>
        <div class="versus" aria-label="พบกับ">VS</div>
        <section id="match-red" class="match-team red"></section>
      </div>
    </div>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="main.js"></script>
</body>

</html>
